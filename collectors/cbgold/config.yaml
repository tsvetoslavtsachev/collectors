# Central bank gold reserves (ЗЛТ5а, 28.09.2026): IMF IRFCL dataflow, all
# countries/aggregates the dataflow serves for this indicator (verified
# 28.09.2026, no key: 88 entries -- 86 ISO3 countries + EZB/G163 aggregates).
# See collectors/cbgold/README.md for the traps (host, sector code, comma vs
# colon, observation ordering) and the naming decision (series per country).

imf:
  # empty COUNTRY segment = wildcard, every country/aggregate the dataflow has
  # for this one indicator+sector+frequency (not just the 5 the ЗЛТ3 brief
  # tested with -- those are the gate floor, not the catalog ceiling).
  url: "https://api.imf.org/external/sdmx/2.1/data/IMF.STA,IRFCL/.IRFCLDT1_IRFCL56V_FTO.S1XS1311.M"
  # same gold's USD value -- evidence for plausibility.repair(), never canon
  url_usd: "https://api.imf.org/external/sdmx/2.1/data/IMF.STA,IRFCL/.IRFCLDT1_IRFCL56_USD.S1XS1311.M"
  indicator: "IRFCLDT1_IRFCL56V_FTO"   # monetary gold, IRFCL sector S1XS1311
  sector: "S1XS1311"                    # NOT _Z -- _Z gives an empty response
  # series_id template: cb_gold_<country code, lowercased>_tonnes
  series_prefix: "cb_gold_"
  series_suffix: "_tonnes"
