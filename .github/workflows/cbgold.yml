name: cbgold-weekly

# Needs repo secrets:
#   DATACORE_PAT  - PAT (repo scope) to checkout + push the private data-core
#
# Refreshes the 88 central-bank gold reserve series (IMF IRFCL) in data-core --
# the cbgold citizen (ЗЛТ5а Част 1, 28.09.2026). Keyless, no login. Mirrors
# gold.yml/cot.yml: fetch -> write canonical through the gate -> commit.
#
# Scheduled BETWEEN gold (04:43 UTC) and the vrm brain (05:23 UTC). The source
# is monthly with a 2-3 month reporting lag (unlike gold's daily cadence), but
# a weekly cron is cheap and keeps the same Saturday rhythm as every other
# citizen -- run.py's freshness check (120d threshold) is what actually knows
# the difference between "normal lag" and "the API broke".

on:
  schedule:
    - cron: "53 4 * * 6"    # Sat 04:53 UTC -- after gold (04:43), before vrm (05:23)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collectors
        uses: actions/checkout@v5

      - name: Checkout data-core (private)
        uses: actions/checkout@v5
        with:
          repository: tsvetoslavtsachev/data-core
          token: ${{ secrets.DATACORE_PAT }}
          path: _data-core

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps + writer lib
        run: |
          pip install -r requirements.txt
          pip install -e "./_data-core[watch]"   # [watch] = jsonschema + pyyaml (writer gate deps)

      - name: Run cbgold collector
        env:
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          PYTHONIOENCODING: utf-8
        run: python -m collectors.cbgold.run

      - name: Commit canonical + health -> data-core (private)
        working-directory: _data-core
        run: |
          git config user.name "collectors-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data health
          git diff --cached --quiet || git commit -m "cbgold: $(date -u +%Y-%m-%d) canonical write"
          git push
