name: gold-weekly

# Needs repo secrets:
#   DATACORE_PAT  - PAT (repo scope) to checkout + push the private data-core
#
# Refreshes the 5 active gold canonical series (gold spot USD + SPDR GLD/GLDM tonnage/oz)
# in data-core -- the gold citizen (ЗЛТ2, 28.09.2026). Since ЗЛТ6 (10.10.2026) LBMA is
# not called (IBA licence): USD is the PM fix read out of the GLD archive, GBP/EUR gold
# and silver are frozen. All sources keyless, no login. Mirrors cot.yml / oil.yml:
# fetch -> write canonical through the gate -> commit.
#
# Scheduled BETWEEN cot (04:23 UTC) and the vrm brain (05:23 UTC) -- gold has no
# vrm-side consumer yet (ЗЛТ4 is the reader, a later session), but this keeps the
# same Saturday cadence as the other citizens and leaves room before the brain runs.

on:
  schedule:
    - cron: "43 4 * * 6"    # Sat 04:43 UTC -- after cot (04:23), before vrm (05:23)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collectors
        uses: actions/checkout@v5

      - name: Checkout data-core (private)
        uses: actions/checkout@v5
        with:
          repository: tsvetoslavtsachev/data-core
          token: ${{ secrets.DATACORE_PAT }}
          path: _data-core

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps + writer lib
        run: |
          pip install -r requirements.txt
          pip install -e "./_data-core[watch]"   # [watch] = jsonschema + pyyaml (writer gate deps)

      - name: Run gold collector
        env:
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          PYTHONIOENCODING: utf-8
        run: python -m collectors.gold.run

      - name: Commit canonical + health -> data-core (private)
        working-directory: _data-core
        run: |
          git config user.name "collectors-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data health
          git diff --cached --quiet || git commit -m "gold: $(date -u +%Y-%m-%d) canonical write"
          git push
