name: vrm-weekly

# Needs repo secrets:
#   DATACORE_PAT   - PAT (repo scope) to checkout + push the private data-core
#   FRED_API_KEY   - FRED api.stlouisfed.org key (macro feed); set on THIS repo
#
# Refreshes the 51 VRM canonical series -- the "food pipe" (INIT-22 E4/E5): yfinance
# prices/idx + ^VIX/^MOVE bridge, FRED macro/liquidity levels, computed ahe_yoy +
# pce_nowcast. Mirrors the oil/cot collectors: fetch -> write canonical -> commit.
#
# ISM (macro_ism_mfg / macro_ism_services) is the LICENSED manual holdout. Its slot
# file (ism_manual.json) is gitignored -> NOT in this checkout -> the 2 ISM series
# are skipped here and their EXISTING canonical is preserved untouched (the write
# path skips a series with no records; it never zeroes one). ISM is refreshed LOCALLY
# when Цветослав enters the monthly Bloomberg print. So CI auto-refreshes the 49
# free-source series; ISM stays manual/monthly. (Future option: move the slot into the
# private data-core repo so CI can refresh it too.)
#
# SCOPE -- two stages, same job: (1) refresh the 51 canonical series (the food), then
# (2) run the VRM brain (run_brain.py) so the 9 deterministic state engines + the
# derived registry/card exporters recompute the full VRM state layer (vrm_regime /
# vrm_overlay / B5 / B6 / B8 / matrix / scorecard + registries/cards)
# on that fresh canonical. Both land in one commit (data + health + registries).
# This is the Gate-3
# "brain switch" (INIT-22, 2026-06-24): data-core state is now LIVE weekly.
# Excel/Cowork VRM still RUNS IN PARALLEL and stays the published source of truth -- the
# real flip (skills -> data-core, Excel retired) is a separate holistic call by Цветослав
# after several agreeing parallel weeks. Nothing here publishes; zero client risk.

on:
  schedule:
    # Sat 05:23 UTC (Р2 суап, 06.08.2026): БЕШЕ 04:23, но мозъкът (run_brain -> e1
    # картите) печеше cot-monitor картата ЧАС ПРЕДИ съботния cot collect (05:23) --
    # картата носеше миналоседмичния принт цяла седмица (хванато от FXY дрила:
    # карта 21.07 срещу канон 28.07). Сега cot върви в 04:23, vrm+мозъкът в 05:23 --
    # картите ядат прясното. Off the round hour: 06:00 sharp queued ~1.5h on the
    # shared scheduler; odd minutes cut that (same lesson as alfred-vintage "17 7").
    # ИЛЮ3 В2 (22.11.2026): съботният ценови ход е в 13:37 UTC (европейският петък); резервата
    # на мозъка е след него и след радара и ротацията (14:07, 14:19); cot (04:23) и gold (04:43)
    # остават преди него. В събота с диригента този ход е втори и не пише нищо ново.
    - cron: "23 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write

# ИЛЮ3 В1 (22.11.2026): диригентът пуска мозъка в събота, а насроченият ход може да го
# застъпи. Опашка, без прекъсване (както cot и gold): вторият тръгва след първия, с пресен
# checkout, а push минава през pull --rebase.
concurrency:
  group: vrm-collector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collectors
        uses: actions/checkout@v5

      - name: Checkout data-core (private)
        uses: actions/checkout@v5
        with:
          repository: tsvetoslavtsachev/data-core
          token: ${{ secrets.DATACORE_PAT }}
          path: _data-core

      # The brain's M-modules (atlas / breadth / amp / inter, steps 11-14) read px_*
      # bars + the catalog from the price archive -- without this checkout they die
      # (2026-07-05 Saturday-rehearsal failure). Contents=READ token only; the brain
      # never writes to the archive.
      - name: Checkout price-archive (private, read-only)
        uses: actions/checkout@v5
        with:
          repository: tsvetoslavtsachev/price-archive
          token: ${{ secrets.PRICE_ARCHIVE_RO_PAT }}
          path: _price-archive
          fetch-depth: 1

      # The brain's E6B bridge step (m_bridge/export_bridge.py, wired 2026-08-25) reads the
      # rotation radar's committed snapshot (docs/data.json) -- the sector-z ranks behind the
      # regime->sector->3-names card. PUBLIC repo, so no token; shallow, read-only. The brain
      # step below points ROTATION_DATA_JSON at this checkout (locally the sibling-repo
      # default path applies).
      - name: Checkout SP500-rotationradar (public, read-only)
        uses: actions/checkout@v5
        with:
          repository: tsvetoslavtsachev/SP500-rotationradar
          path: _rotation-radar
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps + writer lib
        run: |
          pip install -r requirements.txt
          pip install -e "./_data-core[watch]"   # [watch] = jsonschema + pyyaml (superset; harmless)

      - name: Run VRM collector
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          # In CI the data-core checkout IS the installed package's repo (editable
          # install), so assert_safe_root sees DATACORE_ROOT == "real" and requires the
          # explicit opt-in. Writing to the checkout is the intended CI behavior here
          # (the same as oil/cot writing to their data-core checkout).
          DATACORE_ALLOW_REAL: "1"
          # ИЛЮ3 (22.11.2026): mkt_vix / mkt_move идват дневно от ценовия архив (fetch_bridge.py).
          PRICE_ARCHIVE_ROOT: ${{ github.workspace }}/_price-archive
        # ИЛЮ3 В5: код 3 = записът е минал, но глава от Министерството или мостът за
        # VIX/MOVE е паднал. Мозъкът и комитът вървят; ходът червенее в края (стъпка Alarm).
        id: collector
        run: |
          rc=0
          python -m collectors.vrm.run || rc=$?
          if [ "$rc" = "3" ]; then echo "loud=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $rc

      - name: Run VRM brain (recompute state on the fresh canonical)
        env:
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          # Same real-base opt-in as the collector step: in CI the data-core checkout IS
          # the editable-installed package repo, so run_brain's assert_safe_root sees
          # DATACORE_ROOT == "real" and requires the explicit flag. The 9 state engines
          # + derived exporters recompute (in dependency order, each an isolated
          # subprocess) on the canonical the collector just wrote; run_brain forces the
          # absolute root into every child env and applies a per-step truncation floor.
          # Writes data/state + the derived registries/cards under migrations/.
          DATACORE_ALLOW_REAL: "1"
          # M-modules (steps 11-14) read the price archive from the checkout above.
          # The 131-ETF universe + the long-history CSV are VENDORED inside data-core
          # (m_atlas/universe_vendored.json · m_inter/data_all_years.csv) -- no other
          # local-machine path leaks into the runner.
          PRICE_ARCHIVE_ROOT: ${{ github.workspace }}/_price-archive
          # The E6B bridge step reads the rotation radar snapshot from the checkout above.
          ROTATION_DATA_JSON: ${{ github.workspace }}/_rotation-radar/docs/data.json
        run: python _data-core/migrations/vrm_brain/run_brain.py

      - name: Export signals/current.json for signals-registry (reads state only)
        # M2 на signals-registry (25.09.2026): три обекта (vrm-core, vrm-mid, kill-switch) от
        # data/state/vrm_overlay.json + vrm_ks_state.json -> _data-core/signals/current.json.
        # Само чете state, не пише числа в канона. При грешка печата ::warning:: и НЕ проваля
        # рън-а на храната (старият файл остава; регистърът го отчита като stale след 10 дни).
        env:
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          # Четвъртият обект (dollar-correlation, решение на Ц. 25.09 по SR1) чете дневните
          # px_dxy_daily и px_spy_daily от checkout-а на price-archive по-горе; при проблем
          # exporter-ът пише трите VRM обекта и предупреждава.
          PRICE_ARCHIVE_ROOT: ${{ github.workspace }}/_price-archive
        run: python -m collectors.vrm.export_signals

      - name: Friday breadth history + the Fed path (ИЛЮ3 -- the chain, after prices)
        # ИЛЮ3 (22.11.2026): the lights read breadth_history.csv (one row per Friday, ШИРН1)
        # and policy_path_futures.json (ПЪТ1). Neither was written by any job, so both stood
        # where a session last left them. Both read only the price archive checked out above.
        # ИЛЮ3 В6: падането им не спира комита на мозъка (плочки 1, 3, 5, 12, 13); ходът
        # червенее в края и назовава стъпката (стъпка Alarm).
        id: breadth
        continue-on-error: true
        env:
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          PRICE_ARCHIVE_ROOT: ${{ github.workspace }}/_price-archive
        run: python _data-core/migrations/m_breadth/export_breadth.py --history

      - name: The Fed path from the futures strip (ИЛЮ3 -- after prices)
        id: fedpath
        continue-on-error: true
        env:
          DATACORE_ROOT: ${{ github.workspace }}/_data-core
          PRICE_ARCHIVE_ROOT: ${{ github.workspace }}/_price-archive
        run: python _data-core/migrations/m_path/build_path.py --px-root "$PRICE_ARCHIVE_ROOT/archive"

      - name: Commit canonical + state + health + registries -> data-core (private)
        working-directory: _data-core
        run: |
          git config user.name "collectors-bot"
          git config user.email "actions@users.noreply.github.com"
          # Д12 прозорец #2 (2026-07-05, комит-от-CI decision): the brain REGENERATES the
          # derived registries/cards under migrations/ on every run; without committing
          # them the origin copies go stale after each canonical move and the
          # "generated == replay" verify gates run red on every clone. So the runner
          # commits exactly the brain-written registry paths. ks_long stays OUT (a static
          # vendored dataset, no weekly write step -- run_brain only verifies it).
          # m_bridge + m_conc added 2026-10-08: the brain writes them too, but they were
          # missing here, so origin kept stale copies (m-conc verify red on every clone).
          git add data health \
            migrations/s6e_ks migrations/e1_organism_cards \
            migrations/m_atlas migrations/m_breadth \
            migrations/m_amp migrations/m_inter migrations/e2_dashboard \
            migrations/f13_portfolio migrations/m_bridge migrations/m_conc
          # signals/ (за signals-registry) влиза в същия commit; липсва ли (exporter-ът е
          # предупредил), commit-ът на храната не спира заради него.
          if [ -d signals ]; then git add signals; fi
          git diff --cached --quiet || git commit -m "vrm: $(date -u +%Y-%m-%d) canonical + state + registries write"
          # ИЛЮ3 В1: cot, gold и oil пишат в същия data-core; без rebase вторият push пада.
          git pull --rebase --quiet
          git push

      - name: Alarm (ИЛЮ3 В5/В6 -- red at the end, after the commit)
        if: always() && (steps.collector.outputs.loud == '1' || steps.breadth.outcome == 'failure' || steps.fedpath.outcome == 'failure')
        run: |
          [ "${{ steps.collector.outputs.loud }}" = "1" ] && echo "::error::collector: Treasury head rejected or VIX/MOVE archive stale (see the collector log)"
          [ "${{ steps.breadth.outcome }}" = "failure" ] && echo "::error::export_breadth.py --history failed (breadth_history.csv not refreshed)"
          [ "${{ steps.fedpath.outcome }}" = "failure" ] && echo "::error::build_path.py failed (policy_path_futures.json not refreshed)"
          exit 1
